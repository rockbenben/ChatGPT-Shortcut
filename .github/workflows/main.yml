# main 分支上的这个 workflow **不部署**——部署在 speedup/data-retrieval 分支的同名文件里
# （那个才带 JamesIves/github-pages-deploy-action）。这里只做上线前的类型检查与构建校验，
# 所以名字不再是「Deploy」。两个分支的 workflow 同名不同职责，排查时别混。
name: "✅ CI: typecheck & build"

on:
  push:
    branches:
      - main
  # PR 触发：合并前跑同一套检查。**只有配合仓库的分支保护**（required status check
  # 「✅ Typecheck & Build」）才构成真正的闸门；没有它，这里只是让作者提前看到结果。
  pull_request:
    branches:
      - main
  # 手动触发：main 不部署，产物也不上传，但排查线上问题时可以随时重跑一次完整构建。
  workflow_dispatch:

# 构建只需要读仓库。显式声明，避免以后有人加 action 时顺带拿到写权限。
permissions:
  contents: read

# 连续 push 时取消上一轮：构建实测 6–9 分钟，连推三次就是三份重复算力。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-deploy:
    name: ✅ Typecheck & Build
    runs-on: ubuntu-latest
    # 默认超时是 360 分钟，卡死的构建会白占 runner 一天。实测 6–9 分钟，25 分钟足够。
    timeout-minutes: 25
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          # 获取所有标记和分支的所有历史记录（updatetime 必须，否则每次都会变化）
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # 类型检查必须单独跑：Docusaurus 用 swc 剥离类型、构建期**不做**类型检查
      # （实测：带 TS2322 的代码 yarn build 仍以退出码 0 成功），类型错误会直接上线。
      # pretypecheck 还会顺带跑 scripts/checkClipboardFallback.mjs，
      # 否则那份自检在 CI 里永远不会执行。
      # 生成器在这里首次产出 5022 个薄壳，随后 prebuild 命中 .genstamp 快路径（~0.2s）。
      - name: Typecheck
        run: yarn typecheck
      - name: Build website
        run: yarn build

